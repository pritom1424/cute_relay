[build]
command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter && export PATH=$PATH:$HOME/flutter/bin && flutter pub get && flutter build web --wasm --release"
publish = "build/web"

[build.environment]
FLUTTER_VERSION = "3.41.9"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
